name: Publish website files
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Reject source files in the public repository
        shell: bash
        run: |
          test -f index.html && test -f ko/index.html && test -f .nojekyll
          for item in content scripts docs qa source-snapshot node_modules AGENTS.md package.json package-lock.json; do
            if test -e "$item"; then echo "Source-only item must not be public: $item"; exit 1; fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for the uploaded artifact to become available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..20}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fxc "$PAGES_ARTIFACT_NAME" || true)
            if [ "$count" = "1" ]; then exit 0; fi
            echo "Waiting for the current deployment artifact ($attempt/20)."
            sleep 3
          done
          echo "Deployment artifact did not become available."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
