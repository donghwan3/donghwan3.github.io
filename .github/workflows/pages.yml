name: Publish website files
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Reject source files in the public repository
        shell: bash
        run: |
          test -f index.html && test -f ko/index.html && test -f .nojekyll
          for item in content scripts docs qa source-snapshot node_modules AGENTS.md package.json package-lock.json; do
            if test -e "$item"; then echo "Source-only item must not be public: $item"; exit 1; fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
